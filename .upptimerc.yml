# Upptime config for the Curanor + OP Sign public status page.
# Polls our endpoints every 5 minutes via GitHub Actions and posts results
# to GitHub Pages at status.curanor.com.

owner: jasoncumbers
repo: curanor-status

sites:
  - name: Curanor app
    url: https://sign.onepalmetto.com/api/health
    expectedStatusCodes:
      - 200
  - name: Curanor marketing
    url: https://curanor.com
    expectedStatusCodes:
      - 200
      - 301
      - 302
  - name: OP Sign signer entry
    url: https://sign.onepalmetto.com
    expectedStatusCodes:
      - 200
      - 302

status-website:
  cname: status.curanor.com
  name: Curanor Status
  introTitle: Curanor service status
  introMessage: Real-time uptime + incident history for Curanor and One Palmetto Sign.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/jasoncumbers/curanor-status

notifications: []
